<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <title>clone Whatsapp</title>
  </head>
  <body>
    <nav>
      <div class="container-nav">
        <img src="./assets/icons/messages.svg" alt="messages" />
        <img src="./assets/icons/status.svg" alt="status" />
        <img src="./assets/icons/newsletter.svg" alt="newsletter" />
        <img src="./assets/icons/community.svg" alt="community" />
      </div>
      <div class="container-nav">
        <img src="./assets/icons/settings.svg" alt="settings" />
        <img src="https://i.pravatar.cc/150?img=2" alt="" />
      </div>
    </nav>
    <section>
      <div class="container-topo-mensagens">
        <div class="titulo">
          <h1>Whatsapp</h1>
          <div class="icons-titulo">
            <img src="./assets/icons/new-chat.svg" alt="new-chat" />
            <img src="./assets/icons/more-settings.svg" alt="more-settings" />
          </div>
        </div>
        <form action="">
          <input
            type="text"
            placeholder="Pesquisar ou começar uma nova conversa"
          />
        </form>
        <div class="atalhos-itens">
          <button>Tudo</button>
          <button>Não lidas</button>
          <button>Favoritas</button>
          <button>Grupos</button>
        </div>
      </div>
      <div class="container-mensagens">
        <div class="card-mensagem ">
          <img src="https://i.pravatar.cc/150?img=6" alt="Foto Contato">
          <p>José Gabriel</p>
          <p class="horario-mensagem">14:05</p>
          <p class="previa-mensagem">Lorem ipsum dolor sit amet.</p>
        </div>

      </div>
    </section>
    <main><p>3</p></main>
  </body>
</html>
